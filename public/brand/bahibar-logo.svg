    <path d="M22 14H36L22 28V14Z" fill="#12BBDD" />
    <!-- Ledger Rule Lines (#087FDB) -->
    <rect x="24" y="34" width="22" height="3.5" rx="1.75" fill="#087FDB" />
    <rect x="24" y="42" width="22" height="3.5" rx="1.75" fill="#087FDB" />
    <!-- Barbell Horizontal Bar (#101F33) -->
    <rect x="22" y="65" width="56" height="5" rx="2.5" fill="#101F33" />
    <!-- Barbell Left Weight (#12BBDD) -->
    <rect x="28" y="55" width="7" height="25" rx="3.5" fill="#12BBDD" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="21" y="60" width="5" height="15" rx="2.5" fill="#12BBDD" />
    <!-- Barbell Right Weight (#12BBDD) -->
    <rect x="68" y="55" width="7" height="25" rx="3.5" fill="#12BBDD" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="77" y="60" width="5" height="15" rx="2.5" fill="#12BBDD" />
  </g>

  <!-- WORDMARK: BahiBar -->
  <text
    x="82"
    y="49"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="-0.5px"
  >
    <tspan fill="#101F33">Bah</tspan><tspan fill="#101F33">ı</tspan><tspan fill="#087FDB">Bar</tspan>
  </text>
  <!-- Dot on 'i' in cyan (#12BBDD) -->
  <circle cx="152.5" cy="28.5" r="4" fill="#12BBDD" />

  <!-- TAGLINE -->
  <text
    x="84"
    y="67"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="0.2px"
    fill="#64748B"
  >Gym records, sorted.</text>
